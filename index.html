<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InvestTrack India</title><style>
:root{--b:#0a0e13;--p:#111821;--l:#263342;--t:#eef3f7;--m:#8e9aaa;--g:#8fd3b6;--r:#ef8d8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1c2d3b,#0a0e13 45%);color:var(--t);font:14px system-ui,sans-serif}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#0b1016;border-right:1px solid var(--l);padding:22px 12px}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 25px}.logo{width:34px;height:34px;border-radius:10px;background:var(--g);color:#07100c;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--m);font-size:10px}.nav button{display:block;width:100%;border:0;background:none;color:var(--m);padding:11px 12px;border-radius:8px;text-align:left;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#18222d;color:var(--t)}.main{margin-left:220px;padding:28px 32px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.ey{font-size:10px;letter-spacing:.16em;color:var(--m)}h1{margin:5px 0 0;font-size:28px}.actions{display:flex;gap:8px}.btn,.input,.select,textarea{background:#141d27;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:9px 12px}.btn{cursor:pointer}.primary{background:var(--g);color:#07100c;border-color:var(--g);font-weight:800}.danger{color:var(--r)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.35fr .9fr;margin-top:12px}.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(145deg,#131c26,#0f161f);border:1px solid var(--l);border-radius:12px;padding:17px}.label{font-size:10px;text-transform:uppercase;color:var(--m);letter-spacing:.08em}.big{font-size:24px;font-weight:800;margin:7px 0}.muted,.sub{color:var(--m)}.muted{font-size:11px}.sub{font-size:10px;margin-top:2px}.green{color:var(--g)}.red{color:var(--r)}.head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 10px}.head h2{font-size:16px;margin:0}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #202a35;text-align:left;font-size:12px}.table th{color:var(--m);font-size:9px;text-transform:uppercase;background:#101720}.asset{font-weight:700}.pill{background:#19232e;padding:4px 7px;border-radius:99px;font-size:9px}.allocation{height:12px;display:flex;overflow:hidden;border-radius:99px;background:#202a34}.allocation i{height:100%}.chart{height:210px;display:flex;align-items:end;gap:7px;padding:15px 0}.bar{flex:1;background:linear-gradient(#72b8dc,#3f6479);border-radius:5px 5px 0 0}.row{display:flex;justify-content:space-between}.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.wide{width:100%}.progress{height:7px;background:#202a34;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--g)}.empty{text-align:center;color:var(--m);padding:30px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#111821;border:1px solid var(--l);border-radius:12px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--m);font-size:10px;margin-bottom:5px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}.notice{padding:12px;background:#17222d;border:1px solid var(--l);border-radius:8px;color:#b7c2cd;font-size:11px}@media(max-width:900px){.side{width:62px}.brand div:last-child,.nav span{display:none}.main{margin-left:62px;padding:20px 15px}.stats,.three{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:600px){.stats,.three,.form{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start;gap:10px}.actions{width:100%}.actions .btn{flex:1}.main{padding:16px 10px}}
</style></head><body>
<aside class="side"><div class="brand"><div class="logo">₹</div><div><b>InvestTrack</b><small>India portfolio</small></div></div><div class="nav">
<button data-page="dashboard" class="active">⌂ <span>Dashboard</span></button><button data-page="holdings">▤ <span>Holdings</span></button><button data-page="transactions">⇄ <span>Transactions</span></button><button data-page="realized">◒ <span>Realised P/L</span></button><button data-page="goals">◎ <span>Goals</span></button><button data-page="import">⇧ <span>CSV Import</span></button><button data-page="settings">⚙ <span>Settings</span></button></div></aside>
<main class="main"><div class="top"><div><div class="ey">PERSONAL WEALTH</div><h1 id="title">Dashboard</h1></div><div class="actions"><button class="btn" id="refresh">↻ Refresh quotes</button><button class="btn primary" id="add">＋ Add investment</button></div></div><div id="view"></div></main>
<div id="mb" class="modalbg hidden"><div id="modal" class="modal"></div></div>
<script>
"use strict";
var KEY="investtrack-v3", page="dashboard";
var demo=[{id:"1",type:"STOCK",name:"Reliance Industries",symbol:"RELIANCE",exchange:"NSE",date:"2026-06-12",action:"BUY",qty:10,price:1420,charges:40,notes:"Core holding"},{id:"2",type:"STOCK",name:"HDFC Bank",symbol:"HDFCBANK",exchange:"NSE",date:"2026-07-04",action:"BUY",qty:18,price:1910,charges:35,notes:""},{id:"3",type:"STOCK",name:"TCS",symbol:"TCS",exchange:"NSE",date:"2026-05-22",action:"BUY",qty:5,price:3180,charges:25,notes:""},{id:"4",type:"MUTUAL_FUND",name:"Parag Parikh Flexi Cap Fund",symbol:"INF966L01216",exchange:"AMFI",date:"2026-06-05",action:"SIP",qty:75,price:82.4,charges:0,notes:"Monthly SIP"},{id:"5",type:"ETF",name:"Nippon India ETF Nifty BeES",symbol:"NIFTYBEES",exchange:"NSE",date:"2026-08-02",action:"BUY",qty:20,price:285,charges:8,notes:""}];
var q=JSON.parse(localStorage.getItem("investtrack-quotes")||"{}");
var s=JSON.parse(localStorage.getItem(KEY)||"null")||{transactions:demo,goals:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function saveQuotes(){localStorage.setItem("investtrack-quotes",JSON.stringify(q))}
function M(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(n)||0)}
function N(n){return new Intl.NumberFormat("en-IN",{maximumFractionDigits:3}).format(Number(n)||0)}
function P(n){return(Number(n)>=0?"+":"")+Number(n||0).toFixed(2)+"%"}
function E(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function price(t){var v=Number(q[t.symbol]);return v>0?v:Number(t.price)||0}
async function fetchQuote(symbol,exchange){var r=await fetch("/api/quote?symbol="+encodeURIComponent(symbol)+"&exchange="+encodeURIComponent(exchange));var d=await r.json();if(!r.ok||!d.price)throw new Error(d.error||"Quote unavailable");q[symbol]=Number(d.price);saveQuotes();return d}
function H(){var m={};s.transactions.forEach(function(t){var k=t.type+"|"+t.symbol;if(!m[k])m[k]={type:t.type,name:t.name,symbol:t.symbol,exchange:t.exchange,qty:0,cost:0};var h=m[k],n=Number(t.qty)||0,p=Number(t.price)||0,c=Number(t.charges)||0;if(["BUY","SIP","BONUS","RIGHTS"].indexOf(t.action)>=0){h.qty+=n;h.cost+=n*p+c}if(["SELL","REDEMPTION"].indexOf(t.action)>=0){var a=h.qty?h.cost/h.qty:p;h.qty-=n;h.cost-=n*a}});return Object.keys(m).map(function(k){var h=m[k];if(h.qty<=0)return null;h.avg=h.cost/h.qty;h.current=price(h);h.value=h.qty*h.current;h.pnl=h.value-h.cost;return h}).filter(Boolean)}
function R(){var lots={},out=[];s.transactions.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(t){if(["BUY","SIP","BONUS","RIGHTS"].indexOf(t.action)>=0)(lots[t.symbol]||(lots[t.symbol]=[])).push({qty:Number(t.qty),price:Number(t.price)});if(["SELL","REDEMPTION"].indexOf(t.action)>=0){var left=Number(t.qty),cost=0,z=lots[t.symbol]||[];while(left>0&&z.length){var l=z[0],take=Math.min(left,l.qty);cost+=take*l.price;l.qty-=take;left-=take;if(l.qty<=0)z.shift()}out.push({date:t.date,name:t.name,symbol:t.symbol,qty:t.qty,cost:cost,proceeds:Number(t.qty)*Number(t.price)-(Number(t.charges)||0),pnl:Number(t.qty)*Number(t.price)-(Number(t.charges)||0)-cost})}});return out}
function T(){var h=H(),c=h.reduce(function(a,x){return a+x.cost},0),v=h.reduce(function(a,x){return a+x.value},0),r=R().reduce(function(a,x){return a+x.pnl},0);return{h:h,c:c,v:v,p:v-c,ret:c?(v-c)/c*100:0,r:r}}
function table(h){if(!h.length)return'<div class="card empty">No active holdings. Add your first investment.</div>';return'<div class="tablewrap"><table class="table"><thead><tr><th>Asset</th><th>Qty</th><th>Avg</th><th>Current</th><th>Value</th><th>Unrealised P/L</th><th></th></tr></thead><tbody>'+h.map(function(x){return'<tr><td><div class="asset">'+E(x.name)+'</div><div class="sub">'+E(x.symbol)+" · "+E(x.exchange)+'</div></td><td>'+N(x.qty)+'</td><td>'+M(x.avg)+'</td><td>'+M(x.current)+'</td><td>'+M(x.value)+'</td><td class="'+(x.pnl>=0?"green":"red")+'">'+M(x.pnl)+'<div class="sub">'+P(x.cost?x.pnl/x.cost*100:0)+'</div></td><td><button class="btn" data-edit="'+E(x.symbol)+'">Edit</button></td></tr>'}).join("")+"</tbody></table></div>"}
function alloc(h,total){if(!total)return'<div class="empty">Add investments to see allocation.</div>';return'<div class="allocation">'+h.map(function(x,i){return'<i style="width:'+(x.value/total*100)+'%;background:hsl('+(145+i*40)+' 45% 55%)"></i>'}).join("")+'</div>'+h.map(function(x){return'<div class="row muted" style="margin-top:9px"><span>'+E(x.name)+'</span><b>'+((x.value/total)*100).toFixed(1)+'%</b></div>'}).join("")}
function dash(){var t=T(),b=[.45,.5,.47,.58,.63,.68,.65,.76,.82,.93];return'<div class="grid stats"><div class="card"><div class="label">Portfolio value</div><div class="big">'+M(t.v)+'</div><div class="muted">'+t.h.length+' active holdings</div></div><div class="card"><div class="label">Invested cost</div><div class="big">'+M(t.c)+'</div><div class="muted">Net purchase cost</div></div><div class="card"><div class="label">Overall P/L</div><div class="big '+(t.p>=0?"green":"red")+'">'+M(t.p)+'</div><div class="muted '+(t.p>=0?"green":"red")+'">'+P(t.ret)+'</div></div><div class="card"><div class="label">Realised P/L</div><div class="big '+(t.r>=0?"green":"red")+'">'+M(t.r)+'</div><div class="muted">FIFO cost basis</div></div></div><div class="grid two"><div class="card"><div class="head" style="margin:0"><h2>Portfolio trend</h2><span class="muted">Ledger view</span></div><div class="chart">'+b.map(function(x){return'<i class="bar" style="height:'+(x*90)+'%"></i>'}).join("")+'</div></div><div class="card"><div class="head" style="margin:0 0 13px"><h2>Allocation</h2></div>'+alloc(t.h,t.v)+'</div></div><div class="head"><h2>Top holdings</h2><button class="btn" data-page="holdings">View all</button></div>'+table(t.h.sort(function(a,b){return b.value-a.value}).slice(0,8))}
function hold(){return'<div class="search"><input class="input" id="search" placeholder="Search holdings..."><select class="select" id="filter"><option value="">All types</option><option>STOCK</option><option>MUTUAL_FUND</option><option>ETF</option><option>FD</option><option>BOND</option><option>SGB</option><option>PPF</option><option>NPS</option><option>GOLD</option><option>CASH</option><option>OTHER</option></select></div><div id="hm">'+table(H())+"</div>"}
function tx(){var a=s.transactions.slice().sort(function(x,y){return y.date.localeCompare(x.date)});return'<div class="head"><h2>Transaction ledger</h2><button class="btn primary" id="add2">＋ Add transaction</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Action</th><th>Asset</th><th>Qty</th><th>Price/NAV</th><th>Charges</th><th>Notes</th><th></th></tr></thead><tbody>'+a.map(function(x){return'<tr><td>'+E(x.date)+'</td><td><span class="pill">'+E(x.action)+'</span></td><td><div class="asset">'+E(x.name)+'</div><div class="sub">'+E(x.symbol)+'</div></td><td>'+N(x.qty)+'</td><td>'+M(x.price)+'</td><td>'+M(x.charges)+'</td><td class="muted">'+E(x.notes)+'</td><td><button class="btn danger" data-del="'+E(x.id)+'">Delete</button></td></tr>'}).join("")+"</tbody></table></div>"}
function realized(){var a=R(),v=a.reduce(function(x,y){return x+y.pnl},0);return'<div class="grid stats"><div class="card"><div class="label">Realised P/L</div><div class="big '+(v>=0?"green":"red")+'">'+M(v)+'</div></div><div class="card"><div class="label">Realised trades</div><div class="big">'+a.length+'</div></div><div class="card"><div class="label">Method</div><div class="big">FIFO</div></div></div><div class="head"><h2>Realised transactions</h2></div><div class="tablewrap"><table class="table"><thead><tr><th>Sale date</th><th>Asset</th><th>Qty</th><th>Cost basis</th><th>Proceeds</th><th>P/L</th></tr></thead><tbody>'+(a.length?a.map(function(x){return'<tr><td>'+E(x.date)+'</td><td>'+E(x.name)+'<div class="sub">'+E(x.symbol)+'</div></td><td>'+N(x.qty)+'</td><td>'+M(x.cost)+'</td><td>'+M(x.proceeds)+'</td><td class="'+(x.pnl>=0?"green":"red")+'">'+M(x.pnl)+'</td></tr>'}).join(""):'<tr><td colspan="6" class="empty">No realised transactions yet.</td></tr>')+"</tbody></table></div>"}
function goals(){var v=T().v;return'<div class="head"><h2>Financial goals</h2><button class="btn primary" id="goal">Add goal</button></div><div class="grid three">'+(s.goals.length?s.goals.map(function(g){var p=Math.min(100,g.target?v/g.target*100:0);return'<div class="card"><div class="row"><b>'+E(g.name)+'</b><span class="muted">'+E(g.date)+'</span></div><div class="big">'+M(v)+'</div><div class="muted">of '+M(g.target)+'</div><div class="progress"><i style="width:'+p+'%"></i></div><div class="row muted" style="margin-top:7px"><span>'+p.toFixed(1)+'%</span><span>'+M(Math.max(0,g.target-v))+' remaining</span></div></div>'}).join(""):'<div class="card empty">Create a target such as a ₹10 lakh portfolio.</div>')+"</div>"}
function imp(){return'<div class="card"><h2>CSV import</h2><p class="muted">Columns: date,type,name,symbol,exchange,action,qty,price,charges,notes</p><textarea id="csv" class="wide" rows="10"></textarea><div class="modalfoot"><button class="btn primary" id="import">Import</button></div></div>'}
function settings(){return'<div class="grid two"><div class="card"><h2>Market data</h2><p class="muted">Stocks/ETFs use NSE/BSE providers. Mutual funds use AMFI NAV data.</p></div><div class="card"><h2>Data controls</h2><p class="muted">Portfolio data is stored in this browser.</p><button class="btn" id="export">Export JSON</button> <button class="btn danger" id="reset">Reset demo</button></div></div>'}
function render(){var map={dashboard:dash,holdings:hold,transactions:tx,realized:realized,goals:goals,import:imp,settings:settings},titles={dashboard:"Dashboard",holdings:"Holdings",transactions:"Transactions",realized:"Realised P/L",goals:"Goals",import:"CSV Import",settings:"Settings"};document.getElementById("title").textContent=titles[page];document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("active",b.dataset.page===page)});document.getElementById("view").innerHTML=map[page]()}
function close(){document.getElementById("mb").classList.add("hidden")}
async function loadMF(select){try{select.innerHTML='<option>Loading AMFI schemes...</option>';var r=await fetch("/api/mf");var d=await r.json();if(!r.ok)throw new Error(d.error||"AMFI unavailable");select.innerHTML='<option value="">Select mutual fund scheme...</option>'+d.schemes.map(function(m){return'<option value="'+E(m.code)+'" data-name="'+E(m.name)+'" data-nav="'+m.nav+'">'+E(m.name)+" — NAV ₹"+Number(m.nav).toFixed(4)+"</option>"}).join("")}catch(e){select.innerHTML='<option value="">AMFI list unavailable</option>';console.error(e)}}
function openTx(symbol){var old=symbol?s.transactions.find(function(x){return x.symbol===symbol}):null;document.getElementById("modal").innerHTML='<h2>'+(old?"Edit transaction":"Add investment")+'</h2><form id="f"><div class="form"><div class="field"><label>Type</label><select class="select wide" name="type"><option>STOCK</option><option>MUTUAL_FUND</option><option>ETF</option><option>FD</option><option>BOND</option><option>SGB</option><option>PPF</option><option>NPS</option><option>GOLD</option><option>CASH</option><option>OTHER</option></select></div><div class="field"><label>Action</label><select class="select wide" name="action"><option>BUY</option><option>SELL</option><option>SIP</option><option>DIVIDEND</option><option>BONUS</option><option>SPLIT</option><option>RIGHTS</option><option>REDEMPTION</option></select></div><div class="field full"><label>Name</label><input class="input wide" name="name" required></div><div class="field full hidden" id="mfbox"><label>Mutual fund scheme — AMFI</label><select class="select wide" id="mfselect"><option>Select scheme...</option></select></div><div class="field"><label>Symbol / scheme code</label><input class="input wide" name="symbol" required></div><div class="field"><label>Exchange / source</label><select class="select wide" name="exchange"><option>NSE</option><option>BSE</option><option>AMFI</option><option>OTHER</option></select></div><div class="field"><label>Date</label><input class="input wide" type="date" name="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Quantity / units</label><input class="input wide" type="number" step="any" name="qty" required></div><div class="field"><label>Price / NAV</label><input class="input wide" type="number" step="any" name="price" required></div><div class="field"><label>Charges</label><input class="input wide" type="number" step="any" name="charges" value="0"></div><div class="field full"><label>Notes</label><input class="input wide" name="notes"></div></div><div class="modalfoot"><button type="button" class="btn" id="close">Cancel</button><button class="btn primary">Save</button></div></form>';var f=document.getElementById("f"),type=f.elements.type,box=document.getElementById("mfbox"),ms=document.getElementById("mfselect"),ex=f.elements.exchange;function showMF(){box.classList.remove("hidden");ex.value="AMFI";loadMF(ms)}type.onchange=function(){if(type.value==="MUTUAL_FUND")showMF();else box.classList.add("hidden")};ms.onchange=function(){var o=ms.options[ms.selectedIndex];if(!o.value)return;f.elements.symbol.value=o.value;f.elements.name.value=o.dataset.name;f.elements.price.value=o.dataset.nav;q[o.value]=Number(o.dataset.nav);saveQuotes()};if(old){Object.keys(old).forEach(function(k){if(f.elements[k])f.elements[k].value=old[k]});if(old.type==="MUTUAL_FUND")showMF()}document.getElementById("mb").classList.remove("hidden");document.getElementById("close").onclick=close;f.onsubmit=async function(e){e.preventDefault();var o=Object.fromEntries(new FormData(f));o.id=old?old.id:String(Date.now());o.qty=Number(o.qty);o.price=Number(o.price);o.charges=Number(o.charges);if(o.exchange==="AMFI"&&o.symbol){try{await fetchQuote(o.symbol,"AMFI")}catch(err){}}if(old)s.transactions=s.transactions.map(function(x){return x.id===old.id?o:x});else s.transactions.push(o);save();close();render()}}
function openGoal(){document.getElementById("modal").innerHTML='<h2>Add financial goal</h2><form id="gf"><div class="form"><div class="field full"><label>Goal name</label><input class="input wide" name="name" required placeholder="₹10 lakh portfolio"></div><div class="field"><label>Target amount</label><input class="input wide" type="number" name="target" required></div><div class="field"><label>Target date</label><input class="input wide" type="date" name="date"></div></div><div class="modalfoot"><button type="button" class="btn" id="close">Cancel</button><button class="btn primary">Create</button></div></form>';document.getElementById("mb").classList.remove("hidden");document.getElementById("close").onclick=close;document.getElementById("gf").onsubmit=function(e){e.preventDefault();var o=Object.fromEntries(new FormData(e.target));o.id=String(Date.now());o.target=Number(o.target);s.goals.push(o);save();close();render()}}
document.addEventListener("click",function(e){var p=e.target.closest("[data-page]");if(p){page=p.dataset.page;render();return}if(e.target.id==="add"||e.target.id==="add2")openTx();if(e.target.dataset.edit)openTx(e.target.dataset.edit);if(e.target.dataset.del&&confirm("Delete transaction?")){s.transactions=s.transactions.filter(function(x){return x.id!==e.target.dataset.del});save();render()}if(e.target.id==="goal")openGoal();if(e.target.id==="import"){var lines=document.getElementById("csv").value.trim().split(/\r?\n/).filter(Boolean);lines.forEach(function(x){var c=x.split(",");if(c.length>=8)s.transactions.push({id:String(Date.now()+Math.random()),date:c[0],type:c[1],name:c[2],symbol:c[3],exchange:c[4],action:c[5],qty:Number(c[6]),price:Number(c[7]),charges:Number(c[8])||0,notes:c[9]||""})});save();render();alert(lines.length+" row(s) imported")}if(e.target.id==="export"){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download="investment-tracker-backup.json";a.click()}if(e.target.id==="reset"&&confirm("Reset demo data?")){localStorage.removeItem(KEY);s={transactions:demo,goals:[]};save();render()}});
document.addEventListener("input",function(e){if(e.target.id==="search"||e.target.id==="filter"){var qv=(document.getElementById("search").value||"").toLowerCase(),fv=document.getElementById("filter").value;document.getElementById("hm").innerHTML=table(H().filter(function(x){return(!fv||x.type===fv)&&(!qv||x.name.toLowerCase().indexOf(qv)>=0||x.symbol.toLowerCase().indexOf(qv)>=0)}))}});
document.getElementById("refresh").onclick=async function(){var hs=H(),ok=0;for(var i=0;i<hs.length;i++){try{await fetchQuote(hs[i].symbol,hs[i].exchange);ok++}catch(e){}}render();alert(ok+" quote(s) refreshed.")};
document.getElementById("mb").onclick=function(e){if(e.target===document.getElementById("mb"))close()};render();
</script></body></html>
