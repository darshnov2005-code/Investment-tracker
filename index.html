<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e13"><title>InvestTrack India</title><style>
:root{--bg:#0a0e13;--panel:#111821;--panel2:#141d27;--line:#263342;--text:#eef3f7;--muted:#8e9aaa;--green:#8fd3b6;--red:#ef8d8d;--amber:#f2c66d;--blue:#72b8dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1c2d3b,#0a0e13 45%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#0b1016;border-right:1px solid var(--line);padding:22px 12px;z-index:20}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 25px}.logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#07100c;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px}.nav button{display:block;width:100%;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:8px;text-align:left;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#18222d;color:var(--text)}.main{margin-left:220px;padding:28px 32px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.ey{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1{margin:5px 0 0;font-size:28px}h2{font-size:16px}.actions{display:flex;gap:8px}.btn,.input,.select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px}.btn{cursor:pointer}.primary{background:var(--green);color:#07100c;border-color:var(--green);font-weight:800}.danger{color:var(--red)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.35fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(145deg,#131c26,#0f161f);border:1px solid var(--line);border-radius:12px;padding:17px}.label{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.big{font-size:24px;font-weight:800;margin:7px 0}.muted,.sub{color:var(--muted)}.muted{font-size:11px}.sub{font-size:10px;margin-top:2px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 10px}.head h2{margin:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #202a35;text-align:left;font-size:12px}.table th{color:var(--muted);font-size:9px;text-transform:uppercase;background:#101720}.asset{font-weight:700}.pill,.status{background:#19232e;padding:4px 7px;border-radius:99px;font-size:9px;display:inline-flex;align-items:center;gap:5px}.allocation{height:12px;display:flex;overflow:hidden;border-radius:99px;background:#202a34}.allocation i{height:100%}.row{display:flex;justify-content:space-between;gap:10px}.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.wide{width:100%}.progress{height:7px;background:#202a34;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--green)}.empty{text-align:center;color:var(--muted);padding:30px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:50}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#111821;border:1px solid var(--line);border-radius:12px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:12px;background:#17222d;border:1px solid var(--line);border-radius:8px;color:#b7c2cd;font-size:11px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.insight{padding:11px;border:1px solid var(--line);border-radius:9px;background:#101821;font-size:11px}.newsitem{padding:12px 0;border-bottom:1px solid #202a35}.newsitem:last-child{border-bottom:0}.newsitem a{color:var(--text);text-decoration:none;font-weight:700}.newsmeta{font-size:10px;color:var(--muted);margin-top:4px}.sourcebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}.lockscreen{position:fixed;inset:0;background:#080c11f5;display:grid;place-items:center;z-index:100;padding:20px}.lockcard{width:min(420px,100%);background:#111821;border:1px solid var(--line);border-radius:16px;padding:25px;text-align:center}.danger-outline{border-color:#6b3a3a;color:var(--red)}.pinwrap{position:relative}.pinwrap .input{padding-right:42px}.pin-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px}.pin-eye:hover{background:#19232e;color:var(--text)}
@media(max-width:900px){.side{width:100%;height:auto;bottom:auto;right:0;display:flex;overflow:auto;padding:7px 8px}.brand{display:none}.nav{display:flex;min-width:max-content;width:100%;gap:4px}.nav button{width:auto;white-space:nowrap;padding:9px 10px}.main{margin-left:0;padding:72px 12px 20px}.stats,.three{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.insights{grid-template-columns:1fr 1fr}}
@media(max-width:600px){body{font-size:13px}.main{padding:68px 9px 18px}.top{position:sticky;top:48px;z-index:10;background:#0a0e13ee;padding:8px 0;margin:0 0 10px}.top h1{font-size:22px}.actions .btn{font-size:11px;padding:8px}.stats,.three,.form,.insights{grid-template-columns:1fr}.card{padding:13px}.table{min-width:900px}.head{margin-top:17px}.modal{padding:15px}.search .input,.search .select{min-width:0;flex:1}}
</style></head><body>
<aside class="side"><div class="brand"><div class="logo">₹</div><div><b>InvestTrack</b><small>India portfolio</small></div></div><div class="nav">
