px;margin:0}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #202a35;text-align:left;font-size:12px}.table th{color:var(--m);font-size:9px;text-transform:uppercase;background:#101720}.asset{font-weight:700}.pill{background:#19232e;padding:4px 7px;border-radius:99px;font-size:9px}.allocation{height:12px;display:flex;overflow:hidden;border-radius:99px;background:#202a34}.allocation i{height:100%}.chart{height:210px;display:flex;align-items:end;gap:7px;padding:15px 0}.bar{flex:1;background:linear-gradient(#72b8dc,#3f6479);border-radius:5px 5px 0 0}.row{display:flex;justify-content:space-between}.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.wide{width:100%}.progress{height:7px;background:#202a34;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--g)}.empty{text-align:center;color:var(--m);padding:30px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#111821;border:1px solid var(--l);border-radius:12px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--m);font-size:10px;margin-bottom:5px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}.notice{padding:12px;background:#17222d;border:1px solid var(--l);border-radius:8px;color:#b7c2cd;font-size:11px}@media(max-width:900px){.side{width:62px}.brand div:last-child,.nav span{display:none}.main{margin-left:62px;padding:20px 15px}.stats,.three{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:600px){.stats,.three,.form{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start;gap:10px}.actions{width:100%}.actions .bt <main class="main"><div class="top"><div><div class="ey">PERSONAL WEALTH</div><h1 id="title">Dashboard</h1></div><div class="actions"><button class="btn" id="refresh">↻ Refresh quotes</button><button class="btn primary" id="add">＋ Add investment</button></div></div><div id="view"></div></main>

<script>
"use strict";
var KEY="investtrack-v3", page="dashboard";
var demo=[{id:"1",type:"STOCK",name:"Reliance Industries",symbol:"RELIANCE",exchange:"NSE",date:"2026-06-12",action:"BUY",qty:10,price:1420,charges:40,notes:"Core holding"},{id:"2",type:"STOCK",name:"HDFC Bank",symbol:"HDFCBANK",exchange:"NSE",date:"2026-07-04",action:"BUY",qty:18,price:1910,charges:35,notes:""},{id:"3",type:"STOCK",name:"TCS",symbol:"TCS",exchange:"NSE",date:"2026-05-22",action:"BUY",qty:5,price:3180,charges:25,notes:""},{id:"4",type:"MUTUAL_FUND",name:"Parag Parikh Flexi Cap Fund",symbol:"INF966L01216",exchange:"AMFI",date:"2026-06-05",action:"SIP",qty:75,price:82.4,charges:0,notes:"Monthly SIP"},{id:"5",type:"ETF",name:"Nippon India ETF Nifty BeES",symbol:"NIFTYBEES",exchange:"NSE",date:"2026-08-02",action:"BUY",qty:20,price:285,charges:8,notes:""}];
var q=JSON.parse(localStorage.getItem("investtrack-quotes")||"{}");
var s=JSON.parse(localStorage.getItem(KEY)||"null")||{transactions:demo,goals:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function saveQuotes(){localStorage.setItem("investtrack-quotes",JSON.stringify(q))}
function M(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(n)||0)}
function N(n){return new Intl.NumberFormat("en-IN",{maximumFractionDigits:3}).format(Number(n)||0)}
function P(n){return(Number(n)>=0?"+":"")+Number(n||0).toFixed(2)+"%"}
function E(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function price(t){var v=Number(q[t.symbol]);return v>0?v:Number(t.price)||0}
async function fetchQuote(symbol,exchange){var r=await fetch("/api/quote?symbol="+encodeURIComponent(symbol)+"&exchange="+encodeURIComponent(exchange));var d=await r.json();if(!r.ok||!d.price)throw new Error(d.error||"Quote unavailable");q[symbol]=Number(d.price);saveQuotes();return d}
function H(){var m={};s.transactions.forEach(function(t){var k=t.type+"|"+t.symbol;if(!m[k])m[k]={type:t.type,name:t.name,symbol:t.symbol,exchange:t.exchange,qty:0,cost:0};var h=m[k],n=Number(t.qty)||0,p=Number(t.price)||0,c=Number(t.charges)||0;if(["BUY","SIP","BONUS","RIGHTS"].indexOf(t.action)>=0){h.qty+=n;h.cost+=n*p+c}if(["SELL","REDEMPTION"].indexOf(t.action)>=0){var a=h.qty?h.cost/h.qty:p;h.qty-=n;h.cost-=n*a}});return Object.keys(m).map(function(k){var h=m[k];if(h.qty<=0)return null;h.avg=h.cost/h.qty;h.current=price(h);h.value=h.qty*h.current;h.pnl=h.value-h.cost;return h}).filter(Boolean)}
function R(){var lots={},out=[];s.transactions.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(t){if(["BUY","SIP","BONUS","RIGHTS"].indexOf(t.action)>=0)(lots[t.symbol]||(lots[t.symbol]=[])).push({qty:Number(t.qty),price:Number(t.price)});if(["SELL","REDEMPTION"].indexOf(t.action)>=0){var left=Number(t.qty),cost=0,z=lots[t.symbol]||[];while(left>0&&z.length){var l=z[0],take=Math.min(left,l.qty);cost+=take*l.price;l.qty-=take;left-=take;if(l.qty<=0)z.shift()}out.push({date:t.date,name:t.name,symbol:t.symbol,qty:t.qty,cost:cost,proceeds:Number(t.qty)*Number(t.price)-(Number(t.charges)||0),pnl:Number(t.qty)*Number(t.price)-(Number(t.charges)||0)-cost})}});return out}
function T(){var h=H(),c=h.reduce(function(a,x){return a+x.cost},0),v=h.reduce(function(a,x){return a+x.value},0),r=R().reduce(function(a,x){return a+x.pnl},0);return{h:h,c:c,v:v,p:v-c,ret:c?(v-c)/c*100:0,r:r}}
function table(h){
  if(!h.length)return'<div class="card empty">No active holdings. Add your first investment.</div>';
  return'<div class="tablewrap"><table class="table"><thead><tr><th>Asset</th><th>Qty</th><th>Avg</th><th>Current</th><th>Value</th><th>Unrealised P/L</th><th>Actions</th></tr></thead><tbody>'+
  h.map(function(x){
    return'<tr><td><div class="asset">'+E(x.name)+'</div><div class="sub">'+E(x.symbol)+" · "+E(x.exchange)+'</div></td><td>'+N(x.qty)+'</td><td>'+M(x.avg)+'</td><td>'+M(x.current)+'</td><td>'+M(x.value)+'</td><td class="'+(x.pnl>=0?"green":"red")+'">'+M(x.pnl)+'<div class="sub">'+P(x.cost?x.pnl/x.cost*100:0)+'</div></td><td><button class="btn" data-edit="'+E(x.symbol)+'">Edit</button></td></tr>'
  }).join("")+
  "</tbody></table></div>";
}

function holdingFor(symbol){
  return H().find(function(x){return x.symbol===symbol});
}

function openBuy(symbol){
  openTx(symbol,null,"BUY");
}

function openSell(symbol){
  var hld=holdingFor(symbol);
  if(!hld||hld.qty<=0){alert("You do not have any units/shares available to sell.");return;}
  openTx(symbol,null,"SELL");
}

function alloc(h,total){if(!total)return'<div class="empty">Add investments to see allocation.</div>';return'<div class="allocation">'+h.map(function(x,i){return'<i style="width:'+(x.value/total*100)+'%;background:hsl('+(145+i*40)+' 45% 55%)"></i>'}).join("")+'</div>'+h.map(function(x){return'<div class="row muted" style="margin-top:9px"><span>'+E(x.name)+'</span><b>'+((x.value/total)*100).toFixed(1)+'%</b></div>'}).join("")}
function dash(){var t=T();return'<div class="grid stats"><div class="card"><div class="label">Portfolio value</div><div class="big">'+M(t.v)+'</div><div class="muted">'+t.h.length+' active holdings</div></div><div class="card"><div class="label">Invested cost</div><div class="big">'+M(t.c)+'</div><div class="muted">Net purchase cost</div></div><div class="card"><div class="label">Overall P/L</div><div class="big '+(t.p>=0?"green":"red")+'">'+M(t.p)+'</div><div class="muted '+(t.p>=0?"green":"red")+'">'+P(t.ret)+'</div></div><div class="card"><div class="label">Realised P/L</div><div class="big '+(t.r>=0?"green":"red")+'">'+M(t.r)+'</div><div class="muted">FIFO cost basis</div></div></div><div class="card" style="margin-top:12px"><div class="head" style="margin:0 0 13px"><h2>Allocation</h2></div>'+alloc(t.h,t.v)+'</div><div class="head"><h2>Top holdings</h2><button class="btn" data-page="holdings">View all</button></div>'+table(t.h.sort(function(a,b){return b.value-a.value}).slice(0,8))}

function hold(){return'<div class="search"><input class="input" id="search" placeholder="Search holdings..."><select class="select" id="filter"><option value="">All types</option><option>STOCK</option><option>MUTUAL_FUND</option><option>ETF</option><option>FD</option><option>BOND</option><option>SGB</option><option>PPF</option><option>NPS</option><option>GOLD</option><option>CASH</option><option>OTHER</option></select></div><div id="hm">'+table(H())+"</div>"}
function tx(){var a=s.transactions.slice().sort(function(x,y){return y.date.localeCompare(x.date)});return'<div class="head"><h2>Transaction ledger</h2><button class="btn primary" id="add2">＋ Add transaction</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Action</th><th>Asset</th><th>Qty</th><th>Price/NAV</th><th>Charges</th><th>Notes</th><th></th></tr></thead><tbody>'+a.map(function(x){return'<tr><td>'+E(x.date)+'</td><td><span class="pill">'+E(x.action)+'</span></td><td><div class="asset">'+E(x.name)+'</div><div class="sub">'+E(x.symbol)+'</div></td><td>'+N(x.qty)+'</td><td>'+M(x.price)+'</td><td>'+M(x.charges)+'</td><td class="muted">'+E(x.notes)+'</td><td><button class="btn danger" data-del="'+E(x.id)+'">Delete</button></td></tr>'}).join("")+"</tbody></table></div>"}
function realized(){var a=R(),v=a.reduce(function(x,y){return x+y.pnl},0);return'<div class="grid stats"><div class="card"><div class="label">Realised P/L</div><div class="big '+(v>=0?"green":"red")+'">'+M(v)+'</div></div><div class="card"><div class="label">Realised trades</div><div class="big">'+a.length+'</div></div><div class="card"><div class="label">Method</div><div class="big">FIFO</div></div></div><div class="head"><h2>Realised transactions</h2></div><div class="tablewrap"><table class="table"><thead><tr><th>Sale date</th><th>Asset</th><th>Qty</th><th>Cost basis</th><th>Proceeds</th><th>P/L</th></tr></thead><tbody>'+(a.length?a.map(function(x){return'<tr><td>'+E(x.date)+'</td><td>'+E(x.name)+'<div class="sub">'+E(x.symbol)+'</div></td><td>'+N(x.qty)+'</td><td>'+M(x.cost)+'</td><td>'+M(x.proceeds)+'</td><td class="'+(x.pnl>=0?"green":"red")+'">'+M(x.pnl)+'</td></tr>'}).join(""):'<tr><td colspan="6" class="empty">No realised transactions yet.</td></tr>')+"</tbody></table></div>"}
var researchCache={};

function fmtRatio(v){
  if(v===null||v===undefined||v==="") return "—";
  var n=Number(v);
  return Number.isFinite(n)?n.toFixed(2):"—";
}
function fmtPct(v){
  if(v===null||v===undefined||v==="") return "—";
  var n=Number(v);
  return Number.isFinite(n)?(Math.abs(n)<=1?n*100:n).toFixed(2)+"%":"—";
}
function fmtCr(v){
  var n=Number(v);
  if(!Number.isFinite(n))return "—";
  return n>=10000000?"₹"+(n/10000000).toFixed(2)+" Cr":"₹"+(n/100000).toFixed(2)+" L";
}

function research(){
  return '<div class="grid two"><div class="card"><div class="head" style="margin:0 0 12px"><h2>Stock Research</h2><span class="muted">Fundamental + market data</span></div><div class="search"><input class="input" id="researchSymbol" placeholder="Enter NSE symbol e.g. RELIANCE"><select class="select" id="researchExchange"><option>NSE</option><option>BSE</option></select><button class="btn primary" id="researchRun">Research</button></div><div class="notice">This section presents reported company and market metrics for analysis. It does not make a personalised buy/sell recommendation.</div></div><div class="card"><div class="label">How to use</div><div style="margin-top:8px">Enter a listed stock symbol and refresh the research. Metrics are grouped into valuation, profitability, growth, leverage, dividends and price trend.</div></div></div><div id="researchResult" style="margin-top:12px"><div class="card empty">Enter a stock symbol to start research.</div></div>';
}

function metric(label,value,sub){
  return '<div class="card"><div class="label">'+E(label)+'</div><div class="big">'+E(value)+'</div>'+(sub?'<div class="muted">'+E(sub)+'</div>':'')+'</div>';
}

function researchSignal(d){
  var p=d.price||{},f=d.financialData||{},s=d.summaryDetail||{},k=d.keyStats||{};
  var score=0, reasons=[];
  var roe=Number(f.returnOnEquity), margin=Number(f.profitMargins), rev=Number(f.revenueGrowth), earn=Number(f.earningsGrowth), de=Number(f.debtToEquity), cr=Number(f.currentRatio), fc=Number(f.freeCashflow), pe=Number(s.trailingPE||k.trailingPE), px=Number(p.regularMarketPrice), ma50=Number(p.fiftyDayAverage), ma200=Number(p.twoHundredDayAverage);
  if(Number.isFinite(roe)){if(roe>=0.15){score++;reasons.push("ROE is at least 15%");}else if(roe<0.08){score--;reasons.push("ROE is below 8%");}}
  if(Number.isFinite(margin)){if(margin>=0.10){score++;reasons.push("profit margin is at least 10%");}else if(margin<0.05){score--;reasons.push("profit margin is below 5%");}}
  if(Number.isFinite(rev)){if(rev>=0.10){score++;reasons.push("revenue growth is at least 10%");}else if(rev<0){score--;reasons.push("revenue growth is negative");}}
  if(Number.isFinite(earn)){if(earn>=0.10){score++;reasons.push("earnings growth is at least 10%");}else if(earn<0){score--;reasons.push("earnings growth is negative");}}
  if(Number.isFinite(de)){if(de<=75){score++;reasons.push("debt/equity is 75% or lower");}else if(de>150){score--;reasons.push("debt/equity is above 150%");}}
  if(Number.isFinite(cr)){if(cr>=1){score++;reasons.push("current ratio is at least 1");}else if(cr<0.75){score--;reasons.push("current ratio is below 0.75");}}
  if(Number.isFinite(fc)){if(fc>0){score++;reasons.push("free cash flow is positive");}else if(fc<0){score--;reasons.push("free cash flow is negative");}}
  if(Number.isFinite(pe)){if(pe>40){score--;reasons.push("P/E is above 40");}else if(pe>0&&pe<=25){score++;reasons.push("P/E is 25 or lower");}}
  if(Number.isFinite(px)&&Number.isFinite(ma50)&&Number.isFinite(ma200)){if(px>ma50&&px>ma200){score++;reasons.push("price is above both 50D and 200D averages");}else if(px<ma50&&px<ma200){score--;reasons.push("price is below both 50D and 200D averages");}}
  var signal=score>=5?"BUY":score<=1?"SELL":"HOLD";
  var cls=signal==="BUY"?"green":signal==="SELL"?"red":"";
  return {signal:signal,score:score,reasons:reasons.slice(0,6),cls:cls};
}

function researchHTML(d){
  var p=d.price||{},f=d.financialData||{},s=d.summaryDetail||{},k=d.keyStats||{},sig=researchSignal(d);
  var rows=[
    ["Market Cap",fmtCr(p.marketCap),"Valuation"],
    ["P/E",fmtRatio(s.trailingPE||k.trailingPE),"Trailing"],
    ["Forward P/E",fmtRatio(s.forwardPE||k.forwardPE),"Forward"],
    ["P/B",fmtRatio(k.priceToBook),"Price / book"],
    ["EPS",p.epsTrailingTwelveMonths!=null?"₹"+fmtRatio(p.epsTrailingTwelveMonths):"—","TTM"],
    ["ROE",fmtPct(f.returnOnEquity),"Return on equity"],
    ["ROA",fmtPct(f.returnOnAssets),"Return on assets"],
    ["Operating Margin",fmtPct(f.operatingMargins),"TTM"],
    ["Profit Margin",fmtPct(f.profitMargins),"TTM"],
    ["Gross Margin",fmtPct(f.grossMargins),"TTM"],
    ["Revenue Growth",fmtPct(f.revenueGrowth),"YoY"],
    ["Earnings Growth",fmtPct(f.earningsGrowth),"YoY"],
    ["Debt / Equity",fmtRatio(f.debtToEquity),"Leverage"],
    ["Current Ratio",fmtRatio(f.currentRatio),"Liquidity"],
    ["Free Cash Flow",fmtCr(f.freeCashflow),"TTM"],
    ["Dividend Yield",fmtPct(s.dividendYield),"Current"],
    ["52W High",p.fiftyTwoWeekHigh!=null?M(p.fiftyTwoWeekHigh):"—","Price range"],
    ["52W Low",p.fiftyTwoWeekLow!=null?M(p.fiftyTwoWeekLow):"—","Price range"],
    ["50D Average",p.fiftyDayAverage!=null?M(p.fiftyDayAverage):"—","Trend"],
    ["200D Average",p.twoHundredDayAverage!=null?M(p.twoHundredDayAverage):"—","Trend"]
  ];
  return '<div class="head"><h2>'+E(d.name||d.symbol)+' <span class="muted">'+E(d.symbol)+' · '+E(d.exchange)+'</span></h2><span class="muted">Data: '+E(d.source||"Market provider")+'</span></div>'+
    '<div class="card" style="margin-bottom:12px"><div class="label">Research signal</div><div class="big '+sig.cls+'">'+sig.signal+'</div><div class="muted">Score: '+sig.score+' · Based on profitability, growth, leverage, valuation, cash flow and trend rules.</div><div class="notice" style="margin-top:10px">This is a transparent rule-based signal, not a guarantee of returns. Check the underlying metrics and your own risk/holding period before acting.</div><div style="margin-top:10px">'+sig.reasons.map(function(x){return'<span class="pill" style="display:inline-block;margin:3px">'+E(x)+'</span>'}).join("")+'</div></div>'+
    '<div class="grid three">'+rows.map(function(x){return metric(x[0],x[1],x[2])}).join("")+'</div>'+
    '<div class="grid two" style="margin-top:12px"><div class="card"><h2>How the signal works</h2><ul class="muted" style="line-height:1.9"><li>Positive points for stronger ROE/margins, positive growth, positive free cash flow, manageable leverage/liquidity, reasonable P/E and a positive moving-average trend.</li><li>Negative points for weak profitability/growth, high leverage, weak liquidity, negative free cash flow, high P/E or price below both moving averages.</li><li><b>BUY:</b> score 5 or more · <b>HOLD:</b> score 2–4 · <b>SELL:</b> score 1 or below.</li></ul></div><div class="card"><h2>Important</h2><div class="notice">The thresholds are deliberately visible so you can change them later. The signal is a screening aid and should not be treated as a personalised financial recommendation.</div></div></div>';
}
async function runResearch(){
  var input=document.getElementById("researchSymbol"),ex=document.getElementById("researchExchange"),out=document.getElementById("researchResult");
  var symbol=(input.value||"").trim().toUpperCase();
  if(!symbol){out.innerHTML='<div class="card empty">Enter an NSE/BSE stock symbol.</div>';return;}
  out.innerHTML='<div class="card empty">Loading company research…</div>';
  try{
    var r=await fetch("/api/research?symbol="+encodeURIComponent(symbol)+"&exchange="+encodeURIComponent(ex.value));
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||"Research unavailable");
    researchCache[symbol]=d;
    out.innerHTML=researchHTML(d);
  }catch(err){
    out.innerHTML='<div class="card empty">Could not load research for '+E(symbol)+'. '+E(err.message||"Provider error")+'</div>';
  }
}

var technicalCache={};

var marketScannerCache=null;

function scanner(){
  return '<div class="card"><div class="head" style="margin:0 0 12px"><h2>Volume Spike + Strong Trend</h2><span class="muted">Daily timeframe · Chartink</span></div><div class="search"><button class="btn primary" id="marketScan">Refresh Scanner</button><select class="select" id="marketLimit"><option value="25">Top 25</option><option value="50" selected>Top 50</option><option value="100">Top 100</option><option value="200">Top 200</option></select></div><div class="notice">Market-wide NSE cash stocks. Conditions: Volume &gt; 2× 20-day average volume, 20 DMA &gt; 50 DMA &gt; 200 DMA, and Close &gt; 20 DMA.</div></div><div id="marketResult" style="margin-top:12px"><div class="card empty">Click “Refresh Scanner” to load matching stocks.</div></div>';
}

async function loadMarketScanner(){
  var out=document.getElementById("marketResult");
  out.innerHTML='<div class="card empty">Loading Chartink daily scanner…</div>';
  try{
    var r=await fetch("/api/market-scanner");
    var raw=await r.text();
    var d;
    try{d=JSON.parse(raw)}catch(_){throw new Error(raw.slice(0,180)||("HTTP "+r.status))}
    if(!r.ok)throw new Error(d.error||d.detail||"Technical scanner unavailable");
    marketScannerCache=d;
    var rows=(d.stocks||[]).slice(0,Number(document.getElementById("marketLimit").value)||50);
    var html='<div class="head"><h2>Matching Stocks</h2><span class="muted">'+rows.length+' stocks · '+new Date(d.fetchedAt).toLocaleTimeString("en-IN")+'</span></div>';
    html+='<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Stock</th><th>LTP</th><th>Change</th><th>Volume</th><th>20D Avg Vol</th><th>Volume Spike</th><th>Trend</th></tr></thead><tbody>';
    if(!rows.length) html+='<tr><td colspan="7" class="muted">No stocks currently match all conditions.</td></tr>';
    else html+=rows.map(function(x){
      var spike=x.volumeSpike!=null?x.volumeSpike:(x.avgVolume20&&x.volume?x.volume/x.avgVolume20:null);
      return '<tr><td><div class="asset">'+E(x.name||x.symbol)+'</div><div class="sub">'+E(x.symbol)+'</div></td><td>'+M(x.price)+'</td><td class="'+(x.change>=0?"green":"red")+'">'+(Number.isFinite(x.change)?P(x.change):"—")+'</td><td>'+N(x.volume)+'</td><td>'+N(x.avgVolume20)+'</td><td>'+(spike!=null?spike.toFixed(2)+'×':"—")+'</td><td><span class="pill">20DMA &gt; 50DMA &gt; 200DMA</span></td></tr>';
    }).join("");
    html+='</tbody></table></div></div>';
    out.innerHTML=html;
  }catch(e){
    out.innerHTML='<div class="card empty">Could not load technical scanner. '+E(e.message||"Provider error")+'</div>';
  }
}

function close(){document.getElementById("mb").classList.add("hidden")}
var mfCache = null;

async function loadMFData(){
  if(mfCache) return mfCache;
  var r=await fetch("/api/mf");
  var d=await r.json();
  if(!r.ok) throw new Error(d.error||"AMFI unavailable");
  mfCache=d;
  return d;
}

function fillMFSelect(select,items,placeholder,disabled){
  select.innerHTML='<option value="">'+E(placeholder)+'</option>'+items.map(function(x){
    var value=typeof x==="string"?x:x.value;
    var label=typeof x==="string"?x:x.label;
    return '<option value="'+E(value)+'">'+E(label)+'</option>';
  }).join("");
  select.disabled=!!disabled;
}

async function setupMFSelectors(f){
  var box=document.getElementById("mfbox"),amc=document.getElementById("mfamc"),scheme=document.getElementById("mfscheme"),plan=document.getElementById("mfplan"),option=document.getElementById("mfoption"),meta=document.getElementById("mfmeta");
  try{
    var d=await loadMFData();
    fillMFSelect(amc,d.amcs||[],"Select AMC...",false);
    amc.onchange=function(){
      var rows=(d.schemes||[]).filter(function(x){return x.amc===amc.value});
      var names=[...new Set(rows.map(function(x){return x.name}))].sort(function(a,b){return a.localeCompare(b)});
      fillMFSelect(scheme,names,"Select scheme...",false);
      fillMFSelect(plan,[],"Select scheme first...",true);
      fillMFSelect(option,[],"Select plan first...",true);
      meta.textContent="Now select the mutual fund scheme.";
    };
    scheme.onchange=function(){
      var rows=(d.schemes||[]).filter(function(x){return x.amc===amc.value&&x.name===scheme.value});
      fillMFSelect(plan,[...new Set(rows.map(function(x){return x.plan}))],"Select plan...",false);
      fillMFSelect(option,[],"Select plan first...",true);
      meta.textContent="Choose Direct or Regular plan.";
    };
    plan.onchange=function(){
      var rows=(d.schemes||[]).filter(function(x){return x.amc===amc.value&&x.name===scheme.value&&x.plan===plan.value});
      fillMFSelect(option,[...new Set(rows.map(function(x){return x.option}))],"Select option...",false);
      meta.textContent="Choose Growth, IDCW/Dividend or Reinvestment where available.";
    };
    option.onchange=function(){
      var rows=(d.schemes||[]).filter(function(x){return x.amc===amc.value&&x.name===scheme.value&&x.plan===plan.value&&x.option===option.value});
      var row=rows[0];
      if(!row)return;
      f.elements.symbol.value=row.code;
      f.elements.name.value=row.name+" — "+row.plan+" — "+row.option;
      f.elements.price.value=row.nav;
      f.elements.exchange.value="AMFI";
      q[row.code]=Number(row.nav);
      saveQuotes();
      meta.innerHTML="<b>Selected:</b> "+E(row.name)+" · "+E(row.plan)+" · "+E(row.option)+" · NAV ₹"+Number(row.nav).toFixed(4)+" · NAV date "+E(row.date||"—")+" · ISIN "+E(row.isin||row.isinReinvest||"—");
    };
  }catch(e){
    amc.innerHTML='<option value="">AMFI list unavailable</option>';
    scheme.innerHTML='<option value="">Unable to load schemes</option>';
    scheme.disabled=true;plan.disabled=true;option.disabled=true;
    meta.textContent="Could not load the AMFI scheme database. You can still enter the scheme code manually.";
    console.error(e);
  }
}

function openTx(symbol,unused,forcedAction){
  var old=symbol?s.transactions.find(function(x){return x.symbol===symbol}):null; var existing=symbol?holdingFor(symbol):null; var defaultAction=forcedAction||"BUY";
  document.getElementById("modal").innerHTML='<h2>'+(old?"Edit transaction":"Add investment")+'</h2><form id="f"><div class="form"><div class="field"><label>Type</label><select class="select wide" name="type"><option>STOCK</option><option>MUTUAL_FUND</option><option>ETF</option><option>FD</option><option>BOND</option><option>SGB</option><option>PPF</option><option>NPS</option><option>GOLD</option><option>CASH</option><option>OTHER</option></select></div><div class="field"><label>Action</label><select class="select wide" name="action"><option>BUY</option><option>SELL</option><option>SIP</option><option>DIVIDEND</option><option>BONUS</option><option>SPLIT</option><option>RIGHTS</option><option>REDEMPTION</option></select></div><div class="field full"><label>Name</label><input class="input wide" name="name" required></div><div class="field full hidden" id="mfbox"><label>Mutual fund selection — AMFI</label><div class="form" style="margin:0"><div class="field"><label>AMC</label><select class="select wide" id="mfamc"><option>Select AMC...</option></select></div><div class="field"><label>Scheme</label><select class="select wide" id="mfscheme" disabled><option>Select AMC first...</option></select></div><div class="field"><label>Plan</label><select class="select wide" id="mfplan" disabled><option>Select scheme first...</option></select></div><div class="field"><label>Option</label><select class="select wide" id="mfoption" disabled><option>Select plan first...</option></select></div></div><div class="notice" id="mfmeta" style="margin-top:10px">Select AMC → Scheme → Plan → Option. The AMFI code, ISIN and latest NAV will be filled automatically.</div></div><div class="field"><label>Symbol / AMFI scheme code</label><input class="input wide" name="symbol" required></div><div class="field"><label>Exchange / source</label><select class="select wide" name="exchange"><option>NSE</option><option>BSE</option><option>AMFI</option><option>OTHER</option></select></div><div class="field"><label>Date</label><input class="input wide" type="date" name="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Quantity / units</label><input class="input wide" type="number" step="any" name="qty" required></div><div class="field"><label>Price / NAV</label><input class="input wide" type="number" step="any" name="price" required></div><div class="field"><label>Charges</label><input class="input wide" type="number" step="any" name="charges" value="0"></div><div class="field full"><label>Notes</label><input class="input wide" name="notes"></div></div><div class="modalfoot"><button type="button" class="btn" id="close">Cancel</button><button class="btn primary">Save</button></div></form>';
  var f=document.getElementById("f"),type=f.elements.type,box=document.getElementById("mfbox"),ex=f.elements.exchange;
  function showMF(){box.classList.remove("hidden");ex.value="AMFI";setupMFSelectors(f)}
  type.onchange=function(){if(type.value==="MUTUAL_FUND")showMF();else box.classList.add("hidden")};
  if(forcedAction&&!old)f.elements.action.value=defaultAction;
  if(existing&&!old&&forcedAction==="SELL"){
    f.elements.name.value=existing.name;
    f.elements.symbol.value=existing.symbol;
    f.elements.exchange.value=existing.exchange;
    f.elements.price.value=existing.current;
    f.elements.qty.max=existing.qty;
    f.elements.qty.placeholder="Max "+N(existing.qty);
    f.elements.name.readOnly=true;
    f.elements.symbol.readOnly=true;
    f.elements.exchange.disabled=true;
    if(existing.type==="MUTUAL_FUND"){f.elements.type.value="MUTUAL_FUND";showMF();}
  }
  if(old){
    Object.keys(old).forEach(function(k){if(f.elements[k])f.elements[k].value=old[k]});
    if(old.type==="MUTUAL_FUND")showMF();
  }
  document.getElementById("mb").classList.remove("hidden");
  document.getElementById("close").onclick=close;
  f.onsubmit=async function(e){
    e.preventDefault();
    var o=Object.fromEntries(new FormData(f));
    o.id=old?old.id:String(Date.now());o.qty=Number(o.qty);o.price=Number(o.price);o.charges=Number(o.charges);
    if(o.action==="SELL"||o.action==="REDEMPTION"){
      var current=holdingFor(o.symbol);
      var sellQty=Number(o.qty)||0;
      if(!current||sellQty<=0){alert("No quantity available to sell.");return;}
      if(sellQty>current.qty+1e-9){alert("You cannot sell "+N(sellQty)+" units. Your current holding is only "+N(current.qty)+" units.");return;}
    }
    if(o.exchange==="AMFI"&&o.symbol&&o.action!=="SELL"&&o.action!=="REDEMPTION"){try{await fetchQuote(o.symbol,"AMFI")}catch(err){}}
    if(old)s.transactions=s.transactions.map(function(x){return x.id===old.id?o:x});else s.transactions.push(o);
    save();close();render();
  };
}

function openGoal(){document.getElementById("modal").innerHTML='<h2>Add financial goal</h2><form id="gf"><div class="form"><div class="field full"><label>Goal name</label><input class="input wide" name="name" required placeholder="₹10 lakh portfolio"></div><div class="field"><label>Target amount</label><input class="input wide" type="number" name="target" required></div><div class="field"><label>Target date</label><input class="input wide" type="date" name="date"></div></div><div class="modalfoot"><button type="button" class="btn" id="close">Cancel</button><button class="btn primary">Create</button></div></form>';document.getElementById("mb").classList.remove("hidden");document.getElementById("close").onclick=close;document.getElementById("gf").onsubmit=function(e){e.preventDefault();var o=Object.fromEntries(new FormData(e.target));o.id=String(Date.now());o.target=Number(o.target);s.goals.push(o);save();close();render()}}

document.addEventListener("input",function(e){if(e.target.id==="search"||e.target.id==="filter"){var qv=(document.getElementById("search").value||"").toLowerCase(),fv=document.getElementById("filter").value;document.getElementById("hm").innerHTML=table(H().filter(function(x){return(!fv||x.type===fv)&&(!qv||x.name.toLowerCase().indexOf(qv)>=0||x.symbol.toLowerCase().indexOf(qv)>=0)}))}});
