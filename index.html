<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e13"><title>InvestTrack India</title><style>
:root{--bg:#0a0e13;--panel:#111821;--panel2:#141d27;--line:#263342;--text:#eef3f7;--muted:#8e9aaa;--green:#8fd3b6;--red:#ef8d8d;--amber:#f2c66d;--blue:#72b8dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1c2d3b,#0a0e13 45%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#0b1016;border-right:1px solid var(--line);padding:22px 12px;z-index:20}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 25px}.logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#07100c;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px}.nav button{display:block;width:100%;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:8px;text-align:left;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#18222d;color:var(--text)}.main{margin-left:220px;padding:28px 32px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.ey{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1{margin:5px 0 0;font-size:28px}h2{font-size:16px}.actions{display:flex;gap:8px}.btn,.input,.select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px}.btn{cursor:pointer}.primary{background:var(--green);color:#07100c;border-color:var(--green);font-weight:800}.danger{color:var(--red)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.35fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(145deg,#131c26,#0f161f);border:1px solid var(--line);border-radius:12px;padding:17px}.label{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.big{font-size:24px;font-weight:800;margin:7px 0}.muted,.sub{color:var(--muted)}.muted{font-size:11px}.sub{font-size:10px;margin-top:2px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 10px}.head h2{margin:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.asset{font-weight:700}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#1b2834;color:var(--muted);font-size:10px}.bar{height:10px;background:#18222d;border-radius:99px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:var(--green)}.empty{padding:45px 18px;text-align:center;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);text-transform:uppercase}.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px;z-index:40}.modal{width:min(700px,100%);background:#101821;border:1px solid var(--line);border-radius:12px;padding:18px;max-height:90vh;overflow:auto}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{background:#15202b;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:12px}.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search .input,.search .select{min-width:160px}.wide{width:100%}.hidden{display:none!important}.bottomnav{display:none}.lockscreen{position:fixed;inset:0;background:rgba(5,8,12,.92);display:grid;place-items:center;z-index:50}.lockcard{width:min(360px,92vw);background:#101821;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px}.insight{background:#15202b;border:1px solid var(--line);border-radius:10px;padding:12px}.insight b{display:block;margin-bottom:4px}@media (max-width:900px){.side{display:none}.main{margin:0;padding:14px 12px 92px}.bottomnav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#0b1016;border-top:1px solid var(--line);z-index:30}.bottomnav button{border:0;background:none;color:var(--muted);padding:10px 4px;font-size:10px}.bottomnav b{display:block;font-size:16px;margin-bottom:2px;color:#d8e13ee;padding:8px 0;margin:0 0 10px}.top h1{font-size:22px}.actions .btn{font-size:11px;padding:8px}.stats,.three,.form,.insights{grid-template-columns:1fr}.card{padding:13px}.table{min-width:900px}.head{margin-top:17px}.modal{padding:15px}.search .input,.search .select{min-width:0;flex:1}}

<aside class="side"><div class="brand"><div class="logo">₹</div><div><b>InvestTrack</b><small>India portfolio</small></div></div><div class="nav">
